spring:
  application:
    name: ms-notification-streaming

  mongodb:
    host: ${MONGO_HOST:worlddance-mongodb}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DB:wd_notification_streaming_db}
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_HOST:worlddance-mongodb}:${MONGO_PORT:27017}/${MONGO_DB:wd_notification_streaming_db}}

  data:
    mongodb:
      host: ${MONGO_HOST:worlddance-mongodb}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:wd_notification_streaming_db}
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_HOST:worlddance-mongodb}:${MONGO_PORT:27017}/${MONGO_DB:wd_notification_streaming_db}}

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:${CONSUL_HOST:worlddance-consul}}
      port: ${SPRING_CLOUD_CONSUL_PORT:${CONSUL_PORT:8500}}
      health-indicator:
        enabled: false
      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: ${server.servlet.context-path}/actuator/health
        health-check-interval: 10s
        prefer-ip-address: false

  main:
    allow-bean-definition-overriding: true

server:
  port: ${SERVER_PORT:9095}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: false

security:
  jwt:
    secret-key: ${JWT_SECRET:F0bVQgRnuk6DRxooVWKaG0ndlgqEeI/4YXObXeOaR2Q=}
    token-expiration: ${JWT_TOKEN_EXPIRATION:900000}

kick:
  api:
    client-id: "01KZ87S8TAFPDT23710BSJR46E"
    client-secret: "1902b06d32418d18f0631463c88a386eecc92feba10f575b03e621395733dfc1"
    redirect-uri: "https://api.worlddance.win/api/v1/stream/oauth/callback"
    auth-url: "https://id.kick.com/oauth/authorize"
    token-url: "https://id.kick.com/oauth/token"
    base-url: "https://api.kick.com/public/v1"

ffmpeg:
  manager:
    url: ${FFMPEG_MANAGER_URL:http://ffmpeg-manager:3000}

app:
  frontend:
    # Origen del frontend al que se redirige tras el callback OAuth de Kick
    # (StreamSessionController.handleKickCallback). El valor por defecto apunta a `ng serve` en
    # local; docker-compose.yml exporta FRONTEND_BASE_URL=https://worlddance.win explícitamente
    # para producción, así que este default nunca se usa fuera de ejecutar el jar/IDE directo.
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
