spring:
  application:
    name: ms-notification-streaming

  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DB:wd_notification_streaming_db}

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:${CONSUL_HOST:localhost}}
      port: ${SPRING_CLOUD_CONSUL_PORT:${CONSUL_PORT:8500}}
      health-indicator:
        enabled: false
      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: ${server.servlet.context-path}/actuator/health
        health-check-interval: 10s
        prefer-ip-address: false

  main:
    allow-bean-definition-overriding: true

server:
  port: ${SERVER_PORT:9095}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1}

security:
  jwt:
    secret-key: ${JWT_SECRET:/4YXObXeOaR2Q=}
    token-expiration: ${JWT_TOKEN_EXPIRATION:900000}

kick:
  api:
    client-id: "01KZ87S8TAFPDT23710BSJR46E"
    client-secret: "1902b06d32418d18f0631463c88a386eecc92feba10f575b03e621395733dfc1"
    redirect-uri: "http://localhost:9095/api/v1/stream/oauth/callback"
    auth-url: "https://id.kick.com/oauth/authorize"
    token-url: "https://id.kick.com/oauth/token"
    base-url: "https://api.kick.com/public/v1"

obs:
  websocket:
    host: ${OBS_WEBSOCKET_HOST:host.docker.internal}
    port: ${OBS_WEBSOCKET_PORT:4455}
    password: ${OBS_WEBSOCKET_PASSWORD:}