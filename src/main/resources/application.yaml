spring:
  application:
    name: ms-notification-streaming

  mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:wd_notification_streaming_db}

logging:
  level:
    "[org.springframework.web]": ${LOG_LEVEL_WEB:DEBUG}
    "[org.springframework.data.mongodb]": ${LOG_LEVEL_MONGO:DEBUG}

server:
  port: ${PORT:3005}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v3}

security:
  jwt:
    secret-key: ${JWT_SECRET:/4YXObXeOaR2Q=}
    token-expiration: ${JWT_TOKEN_EXPIRATION:900000}